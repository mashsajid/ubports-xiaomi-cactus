# cactus: the MTK BT HAL needs /dev/stpbt (bt_drv, loaded by cactus-wifi-enable).
# If bluebinder talks to the HAL earlier, its retry calls close() on an
# uninitialised HAL, which aborts, and the two loop forever.
[Unit]
After=cactus-wifi-enable.service
Wants=cactus-wifi-enable.service

[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 1 60); do [ -c /dev/stpbt ] && exit 0; sleep 1; done; exit 0'
