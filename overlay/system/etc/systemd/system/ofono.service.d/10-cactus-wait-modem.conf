# cactus: start oFono only once ccci_mdinit reports the modem ready and the MTK RIL
# is up; if oFono binds the RIL slots earlier it loses them when the RIL restarts
# during modem bring-up and does not reconnect.
[Service]
TimeoutStartSec=240
ExecStartPre=/bin/sh -c 'for i in $(seq 1 150); do if [ "$(/system/bin/getprop vendor.mtk.md1.status)" = ready ] && [ "$(/system/bin/getprop init.svc.vendor.ril-daemon-mtk)" = running ]; then sleep 8; exit 0; fi; sleep 1; done; exit 0'
